{
  "schema_version": 1,
  "api_version": "0.5.0",
  "events": [
    {"name": "game.ready", "description": "Emitido após carregar os mods e preparar a API do host; o payload identifica o jogo e as versões. Não garante save ou cena jogável carregados e não aceita decisão via ship.hooks.result.", "description_en": "Emitted after loading mods and preparing the host API; the payload identifies the game and versions. Does not guarantee a loaded save or playable scene and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "mvp", "cancellable": false, "support": ["oot", "mm"], "capability": null, "payload": [
      {"name": "game_id", "type": "game_id", "required": true},
      {"name": "host_version", "type": "string", "required": true},
      {"name": "runtime_version", "type": "string", "required": true},
      {"name": "api_version", "type": "string", "required": true}
    ]},
    {"name": "game.frame", "description": "Emitido a cada frame do host após avançar os timers; frame é o contador do scheduler. É uma notificação, sem decisão via ship.hooks.result.", "description_en": "Emitted on each host frame after advancing timers; frame is the scheduler counter. It is a notification, with no decision via ship.hooks.result.", "kind": "observe", "phase": "mvp", "cancellable": false, "support": ["oot", "mm"], "capability": null, "payload": [
      {"name": "frame", "type": "integer", "required": true}
    ]},
    {"name": "game.shutdown", "description": "Notifica o encerramento do host, sem payload. Não é cancelável nem aceita decisão via ship.hooks.result; não serve como garantia de recuperação após crash.", "description_en": "Notifies host shutdown, with no payload. It is not cancellable and accepts no decision via ship.hooks.result; it is not a crash recovery guarantee.", "kind": "observe", "phase": "mvp", "cancellable": false, "support": ["oot", "mm"], "capability": null, "payload": []},
    {"name": "scene.enter", "description": "Notifica a entrada em uma cena; scene_id identifica a cena. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies entry into a scene; scene_id identifies the scene. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": "scene.events", "payload": [
      {"name": "scene_id", "type": "integer", "required": true}
    ]},
    {"name": "actor.init", "description": "Notifica a inicialização de um ator; actor contém seu handle, identificador e categoria. O host OoT emite o evento para todo ator, depois do init. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies actor initialization; actor contains its handle, identifier and category. The OoT host emits the event for every actor, after init. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": "actor.events", "payload": [
      {"name": "actor", "type": "actor_snapshot", "required": true}
    ]},
    {"name": "actor.update", "description": "Notifica a atualização de um ator; actor contém seu handle, identificador e categoria. O host OoT não emite este evento, por custo. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies an actor update; actor contains its handle, identifier and category. The OoT host does not emit this event, for cost reasons. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": "actor.events", "payload": [
      {"name": "actor", "type": "actor_snapshot", "required": true}
    ]},
    {"name": "actor.destroy", "description": "Notifica a destruição de um ator; handle identifica o ator destruído. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies actor destruction; handle identifies the destroyed actor. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": "actor.events", "payload": [
      {"name": "handle", "type": "actor_handle", "required": true}
    ]},
    {"name": "save.loaded", "description": "No OoT, emitido após carregar um save, no primeiro frame em que o jogador existe; slot identifica o save. É uma notificação, sem decisão via ship.hooks.result.", "description_en": "In OoT, emitted after loading a save, on the first frame when the player exists; slot identifies the save. It is a notification, with no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": "save.events", "payload": [
      {"name": "slot", "type": "integer", "required": true}
    ]},
    {"name": "save.saving", "description": "No OoT, emitido antes de o jogo gravar o arquivo, com o SaveContext ainda por copiar; slot identifica o arquivo. É uma notificação, sem decisão via ship.hooks.result.", "description_en": "In OoT, emitted before the game writes the file, with the SaveContext not yet copied; slot identifies the file. It is a notification, with no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot"], "capability": "save.events", "payload": [
      {"name": "slot", "type": "integer", "required": true}
    ]},
    {"name": "text.open", "description": "Notifica a abertura de um texto; text_id identifica a mensagem. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies a text opening; text_id identifies the message. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": "text.events", "payload": [
      {"name": "text_id", "type": "integer", "required": true}
    ]},
    {"name": "audio.sequence_started", "description": "Notifica o início de uma sequência de áudio; player_index identifica o reprodutor e sequence_id a sequência. Não aceita decisão via ship.hooks.result.", "description_en": "Notifies an audio sequence starting; player_index identifies the sequence player and sequence_id the sequence. Accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": "audio.sequence.events", "payload": [
      {"name": "player_index", "type": "integer", "required": true},
      {"name": "sequence_id", "type": "integer", "required": true}
    ]},
    {"name": "input.hotkey", "description": "Notifica o acionamento de uma hotkey registrada; action é seu id e key a tecla associada. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies activation of a registered hotkey; action is its id and key the associated key. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "host_bridge", "cancellable": false, "support": ["oot", "mm"], "capability": null, "payload": [
      {"name": "action", "type": "string", "required": true},
      {"name": "key", "type": "string", "required": true}
    ]},
    {"name": "input.action", "description": "Emitido em gameplay para pressões de D-pad ou botões C; action identifica a direção, pressed é true e source é controller. ship.hooks.result(true) consome a pressão antes do jogo.", "description_en": "Emitted in gameplay for D-pad or C-button presses; action identifies the direction, pressed is true and source is controller. ship.hooks.result(true) consumes the press before the game handles it.", "kind": "transform", "phase": "host_bridge", "cancellable": false, "support": ["oot"], "capability": "input.actions", "payload": [
      {"name": "action", "type": "string", "required": true},
      {"name": "pressed", "type": "boolean", "required": true},
      {"name": "source", "type": "string", "required": true}
    ]},

    {"name": "hook.oot.player.speed.run", "description": "Emitido ao calcular a velocidade alvo de corrida; speed é o valor atual. ship.hooks.result com número decimal substitui a velocidade; não cancela o movimento.", "description_en": "Emitted when calculating target running speed; speed is its current value. ship.hooks.result with a floating-point number replaces the speed; it does not cancel movement.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "speed", "type": "number", "required": true}
    ]},
    {"name": "hook.oot.player.fall_damage", "description": "Emitido quando o jogo decide aplicar dano de queda, sem payload. ship.hooks.result(false) impede esse dano; um resultado booleano decide sua aplicação.", "description_en": "Emitted when the game decides whether to apply fall damage, with no payload. ship.hooks.result(false) prevents that damage; a boolean result decides whether it is applied.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": []},
    {"name": "hook.oot.item.receive", "description": "Notifica o recebimento de um item; item_id e get_item_id identificam a entrada recebida. Não cancela nem substitui o item via ship.hooks.result.", "description_en": "Notifies item reception; item_id and get_item_id identify the received entry. It neither cancels nor replaces the item through ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "item_id", "type": "integer", "required": true},
      {"name": "get_item_id", "type": "integer", "required": true}
    ]},
    {"name": "hook.oot.player.health_change", "description": "Notifica uma alteração de vida; amount é a quantidade informada pelo hook nativo. Não cancela nem altera a mudança via ship.hooks.result.", "description_en": "Notifies a health change; amount is the quantity reported by the native hook. It neither cancels nor alters the change through ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "amount", "type": "integer", "required": true}
    ]},
    {"name": "hook.oot.player.bonk", "description": "Notifica uma colisão do jogador do tipo bonk, sem payload. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies a player bonk collision, with no payload. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": []},
    {"name": "hook.oot.enemy.defeat", "description": "Notifica uma derrota de inimigo reportada pelo jogo; o payload traz o snapshot, o id, a categoria e a posição do ator. Não representa toda destruição de ator nem aceita decisão via ship.hooks.result.", "description_en": "Notifies an enemy defeat reported by the game; the payload carries the actor's snapshot, id, category and position. It does not represent every actor destruction and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "actor", "type": "actor_snapshot", "required": true},
      {"name": "actor_id", "type": "integer", "required": true},
      {"name": "category", "type": "integer", "required": true},
      {"name": "pos_x", "type": "number", "required": true},
      {"name": "pos_y", "type": "number", "required": true},
      {"name": "pos_z", "type": "number", "required": true}
    ]},
    {"name": "hook.oot.actor.damage", "description": "Emitido antes de somar dano de colisão a um ator sem AC_HARD, antes do multiplicador cooperativo, uma vez por elemento acertado. target_id e target_category identificam o alvo; attacker_id e attacker_category identificam o dono do collider AT que acertou o elemento e valem -1 sem atacante. attacker_is_player indica AT_TYPE_PLAYER; dmg_flags traz toucher.dmgFlags e damage_effect traz o efeito já calculado. base_damage é o dano calculado pelo jogo e damage é o valor após os hooks nativos. ship.hooks.result com número finito substitui damage, limitado pelo host a 0..255; se algum hook nativo ou Lua trocou o valor, o host limita também ao que falta para 255 no dano acumulado u8 do alvo, antes do multiplicador cooperativo. Sem resultado ou com resultado não numérico, mantém damage. Dano que não passa por esse funil não é coberto: débitos de chefes que não usam o dano central, agarrões via play->damagePlayer, empurrões com dano, queda, fogo e armadilhas nesses caminhos. Com target_extended, damage está nas unidades da vida estendida do alvo e o limite é 0..65535 e a vida que resta, em vez de 0..255.", "description_en": "Emitted before adding collision damage to an actor without AC_HARD, before the cooperative multiplier, once per hit element. target_id and target_category identify the target; attacker_id and attacker_category identify the owner of the AT collider that hit the element and are -1 without an attacker. attacker_is_player indicates AT_TYPE_PLAYER; dmg_flags carries toucher.dmgFlags and damage_effect carries the computed effect. base_damage is the damage calculated by the game and damage is the value after native hooks. ship.hooks.result with a finite number replaces damage, clamped by the host to 0..255; if any native or Lua hook changed the value, the host also clamps it to what is left up to 255 in the target's accumulated u8 damage, before the cooperative multiplier. No result or a nonnumeric result preserves damage. Damage outside this path is not covered: boss health deductions that do not use central damage, grabs using play->damagePlayer, knockback damage, falls, fire and traps on those paths. With target_extended, damage is in the target's extended health units and the limit is 0..65535 and the remaining health, instead of 0..255.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "target_id", "type": "integer", "required": true},
      {"name": "target_category", "type": "integer", "required": true},
      {"name": "attacker_id", "type": "integer", "required": true},
      {"name": "attacker_category", "type": "integer", "required": true},
      {"name": "attacker_is_player", "type": "boolean", "required": true},
      {"name": "dmg_flags", "type": "integer", "required": true},
      {"name": "damage_effect", "type": "integer", "required": true},
      {"name": "base_damage", "type": "number", "required": true},
      {"name": "damage", "type": "number", "required": true},
      {"name": "target", "type": "actor_snapshot", "required": true},
      {"name": "attacker", "type": "actor_snapshot", "required": false},
      {"name": "target_health", "type": "integer", "required": true},
      {"name": "target_max_health", "type": "integer", "required": true},
      {"name": "target_extended", "type": "boolean", "required": true}
    ]},
    {"name": "hook.oot.actor.damaged", "description": "Notifica o dano que um ator de fato perdeu, quando ele aplica o dano (Actor_ApplyDamage) ou quando o host confirma um débito estendido. amount está nas unidades do alvo; health e max_health são a vida depois do dano. Não cobre o Link nem chefes com conta própria.", "description_en": "Notifies the damage an actor actually lost, when it applies damage (Actor_ApplyDamage) or when the host confirms an extended debit. amount is in the target's units; health and max_health are the health after the damage. Does not cover Link nor bosses with their own math.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "target", "type": "actor_snapshot", "required": true},
      {"name": "amount", "type": "integer", "required": true},
      {"name": "health", "type": "integer", "required": true},
      {"name": "max_health", "type": "integer", "required": true},
      {"name": "extended", "type": "boolean", "required": true}
    ]},
    {"name": "hook.oot.item.give", "description": "Emitido antes de entregar um item; item_id e get_item_id descrevem a entrada atual. ship.hooks.result com um get_item_id inteiro válido substitui a entrada pela tabela vanilla; não é um cancelamento.", "description_en": "Emitted before giving an item; item_id and get_item_id describe the current entry. ship.hooks.result with a valid integer get_item_id replaces the entry using the vanilla table; it is not cancellation.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "item_id", "type": "integer", "required": true},
      {"name": "get_item_id", "type": "integer", "required": true}
    ]},
    {"name": "hook.oot.hud.draw", "description": "Emitido após desenhar o mundo e antes do HUD nativo, sem payload. É a janela válida para ship.hud.draw_*; não aceita decisão via ship.hooks.result.", "description_en": "Emitted after drawing the world and before the native HUD, with no payload. This is the valid window for ship.hud.draw_*; it accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hud.draw", "payload": []},
    {"name": "hook.oot.player.first_person_control", "description": "Emitido por frame enquanto o controle em primeira pessoa está ativo; held_item_action identifica a ação do item segurado. É uma notificação, sem decisão via ship.hooks.result.", "description_en": "Emitted each frame while first-person control is active; held_item_action identifies the held item's action. It is a notification, with no decision via ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "held_item_action", "type": "integer", "required": true}
    ]},
    {"name": "hook.oot.player.arrow_type_select", "description": "Emitido ao selecionar a flecha para consumo de magia; magic_arrow_type e arrow_type são os tipos atuais. ship.hooks.result com inteiro substitui arrow_type; não cancela o disparo.", "description_en": "Emitted when selecting the arrow for magic consumption; magic_arrow_type and arrow_type are the current types. ship.hooks.result with an integer replaces arrow_type; it does not cancel firing.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "hooks.bridge", "payload": [
      {"name": "magic_arrow_type", "type": "integer", "required": true},
      {"name": "arrow_type", "type": "integer", "required": true}
    ]},
    {"name": "hook.oot.player.body_anim_select", "description": "Emitido na seleção automática de animação do corpo customizado, quando nenhum override assume a pose; o payload resume movimento e ações. ship.hooks.result com nome presente em anims escolhe a animação.", "description_en": "Emitted during automatic custom body animation selection when no override owns the pose; the payload summarizes movement and actions. ship.hooks.result with a name present in anims selects the animation.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["oot"], "capability": "oot.player.custom_body", "payload": [
      {"name": "speed", "type": "number", "required": true},
      {"name": "on_ground", "type": "boolean", "required": true},
      {"name": "rolling", "type": "boolean", "required": true},
      {"name": "roll_charge", "type": "integer", "required": true},
      {"name": "roll_phase", "type": "string", "required": true},
      {"name": "falling", "type": "boolean", "required": true},
      {"name": "landing", "type": "boolean", "required": true},
      {"name": "climbing", "type": "boolean", "required": true},
      {"name": "climb_direction", "type": "string", "required": true},
      {"name": "climb_step", "type": "integer", "required": true},
      {"name": "climb_starting", "type": "boolean", "required": true},
      {"name": "door_opening", "type": "boolean", "required": true},
      {"name": "door_direction", "type": "string", "required": true},
      {"name": "chest_opening", "type": "boolean", "required": true},
      {"name": "instrument", "type": "boolean", "required": true},
      {"name": "attacking", "type": "boolean", "required": true},
      {"name": "attack_animation", "type": "integer", "required": true}
    ]},

    {"name": "hook.mm.player.speed.walk", "description": "Ponto de transformação da velocidade de movimento no MM; speed é o valor atual. O exemplo envia a velocidade modificada com ship.hooks.result; não é um cancelamento do movimento.", "description_en": "Movement speed transformation point in MM; speed is the current value. The example sends the modified speed through ship.hooks.result; this is not movement cancellation.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["mm"], "capability": "hooks.bridge", "payload": [
      {"name": "speed", "type": "number", "required": true}
    ]},
    {"name": "hook.mm.player.goron_roll.consume_magic", "description": "Ponto de decisão sobre consumir magia no rolamento Goron, sem payload. O exemplo usa ship.hooks.result(false) para impedir o consumo.", "description_en": "Decision point for consuming magic during Goron rolling, with no payload. The example uses ship.hooks.result(false) to prevent consumption.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["mm"], "capability": "hooks.bridge", "payload": []},
    {"name": "hook.mm.player.goron_roll.disable_spike_mode", "description": "Ponto de decisão sobre sair do modo espinho do rolamento Goron, sem payload. O exemplo usa ship.hooks.result(false) para manter o modo ativo.", "description_en": "Decision point for leaving Goron rolling spike mode, with no payload. The example uses ship.hooks.result(false) to keep the mode active.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["mm"], "capability": "hooks.bridge", "payload": []},
    {"name": "hook.mm.player.goron_roll.increase_spike_level", "description": "Ponto de decisão sobre aumentar o nível de espinho do rolamento Goron, sem payload. O exemplo usa ship.hooks.result(true) para permitir o aumento.", "description_en": "Decision point for increasing the Goron rolling spike level, with no payload. The example uses ship.hooks.result(true) to allow the increase.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["mm"], "capability": "hooks.bridge", "payload": []},
    {"name": "hook.mm.item.give", "description": "Notifica a entrega de um item no MM; item identifica o item. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies an item being given in MM; item identifies the item. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["mm"], "capability": "hooks.bridge", "payload": [
      {"name": "item", "type": "integer", "required": true}
    ]},
    {"name": "hook.mm.enemy.defeat", "description": "Notifica a derrota de um inimigo no MM; o payload traz id, categoria e posição do ator. Não é cancelável nem aceita decisão via ship.hooks.result.", "description_en": "Notifies an enemy defeat in MM; the payload carries the actor's id, category and position. It is not cancellable and accepts no decision via ship.hooks.result.", "kind": "observe", "phase": "hook_bridge", "cancellable": false, "support": ["mm"], "capability": "hooks.bridge", "payload": [
      {"name": "actor_id", "type": "integer", "required": true},
      {"name": "category", "type": "integer", "required": true},
      {"name": "pos_x", "type": "number", "required": true},
      {"name": "pos_y", "type": "number", "required": true},
