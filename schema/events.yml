    ]},
    {"name": "hook.mm.item.should_give", "description": "Ponto de decisão sobre entregar um item no MM; item identifica o item em avaliação. A resposta usa ship.hooks.result conforme o contrato do host.", "description_en": "Decision point for giving an item in MM; item identifies the item being evaluated. The response uses ship.hooks.result according to the host contract.", "kind": "transform", "phase": "hook_bridge", "cancellable": false, "support": ["mm"], "capability": "hooks.bridge", "payload": [
      {"name": "item", "type": "integer", "required": true}
