{
  "schema_version": 1,
  "api_version": "0.5.0",
  "capabilities": [
    {"name": "core.events", "status": "contract", "hosts": ["oot", "mm"], "description": "Eventos e lifecycle centrais do host.", "description_en": "Core host events and lifecycle."},
    {"name": "hooks.bridge", "status": "contract", "hosts": ["oot", "mm"], "description": "Ponte genérica para os pontos de instrumentação nativos (VB_*/On* do GameInteractor) — eventos hook.* assináveis com ship.events.on e decididos com ship.hooks.result, sem precisar de função nativa dedicada por habilidade.", "description_en": "Generic bridge to the native instrumentation points (GameInteractor VB_*/On*): hook.* events you subscribe to with ship.events.on and decide with ship.hooks.result, without a dedicated native function per ability."},
    {"name": "core.timers", "status": "contract", "hosts": ["oot", "mm"], "description": "Timers por frame com ownership por mod.", "description_en": "Per-frame timers owned by each mod."},
    {"name": "core.input", "status": "contract", "hosts": ["oot", "mm"], "description": "Registro de hotkeys e eventos de input.", "description_en": "Hotkey registration and input events."},
    {"name": "core.menu", "status": "contract", "hosts": ["oot"], "description": "Páginas de menu declarativas por mod, com valores persistidos exclusivamente em ship.storage e input entregue fora do draw pass.", "description_en": "Declarative per-mod menu pages, with values persisted only in ship.storage and input delivered outside the draw pass."},
    {"name": "input.actions", "status": "contract", "hosts": ["oot"], "description": "Emite ações direcionais consumíveis do controle; input vanilla só é bloqueado quando um callback aceita a ação.", "description_en": "Emits consumable directional controller actions; vanilla input is blocked only when a callback accepts the action."},
    {"name": "game.state", "status": "contract", "hosts": ["oot"], "description": "Expõe modo estável de gameplay, pausa, diálogo, cutscene, transição, morte, loading ou indisponível.", "description_en": "Exposes a stable gameplay mode: pause, dialog, cutscene, transition, death, loading or unavailable."},
    {"name": "core.storage", "status": "contract", "hosts": ["oot", "mm"], "description": "Armazenamento chave-valor com namespace por mod, persistente em disco entre sessões.", "description_en": "Key-value storage namespaced per mod, persisted to disk across sessions."},
    {"name": "core.storage.shared", "status": "contract", "hosts": ["oot", "mm"], "description": "Armazenamento chave-valor COMPARTILHADO entre os dois jogos (mesmo arquivo no diretório de sessão do launcher). Namespaced por mod, mas o mesmo mod vê o mesmo estado em OoT e MM — base para progresso de randomizer cross-game e stats que atravessam o world-travel.", "description_en": "Key-value storage SHARED between both games (same file in the launcher session directory). Namespaced per mod, but the same mod sees the same state in OoT and MM: the basis for cross-game randomizer progress and stats that survive world travel."},
    {"name": "oot.audio", "status": "contract", "hosts": ["oot"], "description": "Redireciona o sfx de voz do jogador para outro bloco de vozes — necessário para uma forma customizada não continuar soando como o Link. set_voice_map(base, offset) desloca o bloco inteiro: o Link tem suas vozes a partir de 0x6800 e cada forma do MM tem a sua no mesmo formato (Goron 0xC0, Zora 0xA0, Deku 0x80, Fierce Deity 0x00), então trocar a voz é somar um offset e não mapear som por som. As amostras vêm do soundfont do MM montado sob mm/; se a amostra faltar, cai na voz nativa em vez de ficar mudo.", "description_en": "Redirects the player's voice sfx to another voice bank, so a custom form does not keep sounding like Link. set_voice_map(base, offset) shifts the whole bank: Link's voices start at 0x6800 and each MM form has its own in the same layout (Goron 0xC0, Zora 0xA0, Deku 0x80, Fierce Deity 0x00), so changing the voice is adding an offset, not mapping sound by sound. Samples come from the MM soundfont mounted under mm/; a missing sample falls back to the native voice instead of going silent."},
    {"name": "oot.cutscene", "status": "contract", "hosts": ["oot"], "description": "Assume a câmera por um número de frames com uma subcâmera dedicada, congelando atores e entrando em modo cutscene — o enquadramento dramático que a troca de máscara de MM tem. Genérica: serve para transformação, item, revelação.", "description_en": "Takes over the camera for a number of frames with a dedicated subcamera, freezing actors and entering cutscene mode: the dramatic framing MM uses for mask transformations. Generic: works for transformations, items, reveals."},
    {"name": "oot.env", "status": "contract", "hosts": ["oot"], "description": "Lê estado do AMBIENTE (separado do jogador): time_of_day (0..1), is_night (0/1) e scene_id. Base para mecânicas que reagem a hora do dia e local.", "description_en": "Reads ENVIRONMENT state (separate from the player): time_of_day (0..1), is_night (0/1) and scene_id. Basis for mechanics that react to time of day and location."},
    {"name": "hud.draw", "status": "contract", "hosts": ["oot"], "description": "Desenha retângulos e texto sobre o HUD do jogo, a partir do evento hook.<jogo>.hud.draw. Primitiva genérica: o host não conhece 'barra de vida' nem 'medidor de fome' — o mod compõe o que quiser com retângulos e texto.", "description_en": "Draws rectangles and text over the game HUD from the hook.<game>.hud.draw event. Generic primitive: the host knows nothing about 'health bars' or 'hunger meters'; the mod composes whatever it wants from rectangles and text."},
    {"name": "hud.icons", "status": "contract", "hosts": ["oot"], "description": "Desenha uma textura registrada no resource manager como ícone de HUD, com dimensões e alpha limitados.", "description_en": "Draws a texture registered in the resource manager as a HUD icon, with bounded size and alpha."},
    {"name": "scene.events", "status": "contract", "hosts": ["oot", "mm"], "description": "Eventos comuns de cena.", "description_en": "Common scene events."},
    {"name": "actor.events", "status": "contract", "hosts": ["oot", "mm"], "description": "Eventos comuns de ator com handles e snapshots.", "description_en": "Common actor events with handles and snapshots."},
    {"name": "actor.spawn", "status": "contract", "hosts": ["oot", "mm"], "description": "Cria um ator allowlisted com ownership e handle seguro.", "description_en": "Spawns an allowlisted actor with ownership and a safe handle."},
    {"name": "actor.destroy", "status": "contract", "hosts": ["oot", "mm"], "description": "Destrói um ator pertencente ao mod chamador.", "description_en": "Destroys an actor owned by the calling mod."},
    {"name": "actor.exists", "status": "contract", "hosts": ["oot", "mm"], "description": "Consulta a validade de um handle de ator pertencente ao mod.", "description_en": "Checks whether an actor handle owned by the mod is still valid."},
    {"name": "save.events", "status": "contract", "hosts": ["oot", "mm"], "description": "Eventos comuns de carregamento de save.", "description_en": "Common save-load events."},
    {"name": "text.events", "status": "contract", "hosts": ["oot", "mm"], "description": "Eventos comuns de texto somente leitura.", "description_en": "Common read-only text events."},
    {"name": "audio.sequence.events", "status": "contract", "hosts": ["oot", "mm"], "description": "Eventos de início de sequência de áudio.", "description_en": "Audio sequence start events."},
    {"name": "world.travel", "status": "contract", "hosts": ["oot", "mm"], "description": "Solicita handoff autenticado para um destino lógico no outro host.", "description_en": "Requests an authenticated handoff to a logical destination in the other host."},
    {"name": "mm.room.events", "status": "planned", "hosts": ["mm"], "description": "Eventos de room exclusivos de Majora's Mask.", "description_en": "Room events exclusive to Majora's Mask."},
    {"name": "mm.cycle", "status": "planned", "hosts": ["mm"], "description": "Lifecycle do ciclo de três dias.", "description_en": "Three-day cycle lifecycle."},
    {"name": "mm.owl_save", "status": "planned", "hosts": ["mm"], "description": "Semântica de owl save.", "description_en": "Owl save semantics."},
    {"name": "mm.clock", "status": "planned", "hosts": ["mm"], "description": "Leitura estável do relógio de MM.", "description_en": "Stable read of the MM clock."},
    {"name": "mm.player.jump", "status": "contract", "hosts": ["mm"], "description": "Aplica um impulso vertical validado ao jogador de Majora's Mask quando ele está no chão.", "description_en": "Applies a validated vertical impulse to the Majora's Mask player while on the ground."},
    {"name": "mm.spawn_dog", "status": "contract", "hosts": ["mm"], "description": "Spawna o cachorro de Clock Town (En_Dg) perto do jogador de Majora's Mask.", "description_en": "Spawns the Clock Town dog (En_Dg) near the Majora's Mask player."},
    {"name": "mm.player.sword_skin", "status": "contract", "hosts": ["mm"], "description": "Alterna o visual da espada Kokiri empunhada entre o modelo de Majora's Mask e o de Ocarina of Time (lido do oot.o2r vizinho).", "description_en": "Switches the held Kokiri Sword between the Majora's Mask model and the Ocarina of Time one (read from the neighboring oot.o2r)."},
    {"name": "oot.player.jump", "status": "contract", "hosts": ["oot"], "description": "Aplica um impulso vertical validado ao jogador de OoT quando ele está no chão.", "description_en": "Applies a validated vertical impulse to the OoT player while on the ground."},
    {"name": "oot.spawn_dog", "status": "contract", "hosts": ["oot"], "description": "Spawna um cachorro (En_Dog) perto do jogador de OoT.", "description_en": "Spawns a dog (En_Dog) near the OoT player."},
    {"name": "oot.player.bunny_hood", "status": "contract", "hosts": ["oot"], "description": "Veste a Bunny Hood em OoT com o comportamento de Majora's Mask (corrida mais rápida e pulo maior).", "description_en": "Wears the Bunny Hood in OoT with Majora's Mask behavior (faster running and higher jumps)."},
    {"name": "oot.player.mask", "status": "contract", "hosts": ["oot"], "description": "Equipa qualquer máscara de OoT pelo nome lógico, sem ocupar um botão C.", "description_en": "Equips any OoT mask by logical name, without taking a C button."},
    {"name": "player.speed", "status": "contract", "hosts": ["oot", "mm"], "description": "Multiplica a velocidade de movimento do jogador por um fator validado (0.1–5.0); 1.0 restaura.", "description_en": "Multiplies the player's movement speed by a validated factor (0.1 to 5.0); 1.0 restores it."},
    {"name": "player.fields", "status": "contract", "hosts": ["oot"], "description": "Lê e escreve campos nomeados do jogador com validação de faixa: health, health_capacity, magic, rupees, pos_x/y/z, rot_y, speed, vel_x/y/z (leitura e escrita); on_ground, rolling, swimming (só leitura); climbing (leitura; escrever 0 solta o jogador da escada e o faz cair); screen_x, screen_y (só leitura — projeção do jogador na tela, para ancorar HUD ao personagem em vez de a um canto fixo). Chaves fora desta lista viram armazenamento livre por sessão.", "description_en": "Reads and writes named player fields with range validation: health, health_capacity, magic, rupees, pos_x/y/z, rot_y, speed, vel_x/y/z (read and write); on_ground, rolling, swimming (read only); climbing (read; writing 0 releases the player from the ladder and makes them fall); screen_x, screen_y (read only: the player's projection on screen, to anchor HUD to the character instead of a fixed corner). Keys outside this list become free per-session storage."},
    {"name": "oot.player.attach_model", "status": "contract", "hosts": ["oot"], "description": "Desenha uma display list arbitrária no jogador por caminho de resource, incluindo assets de mod e do jogo vizinho.", "description_en": "Draws an arbitrary display list on the player by resource path, including mod assets and assets from the neighboring game."},
    {"name": "mod.assets", "status": "contract", "hosts": ["oot"], "description": "Archives (.o2r/.otr) na pasta de mods ficam endereçáveis sob mod/<nome>/, permitindo que um mod traga conteúdo próprio.", "description_en": "Archives (.o2r/.otr) in the mods folder become addressable under mod/<name>/, so a mod can ship its own content."},
    {"name": "oot.player.immunity", "status": "contract", "hosts": ["oot"], "description": "Concede imunidade a um tipo de dano (hoje: fogo).", "description_en": "Grants immunity to a damage type (currently: fire)."},
    {"name": "oot.player.weight", "status": "contract", "hosts": ["oot"], "description": "Alterna o peso do jogador entre normal e pesado (afunda na água, resiste a empurrão).", "description_en": "Toggles the player's weight between normal and heavy (sinks in water, resists pushes)."},
    {"name": "oot.player.roll", "status": "contract", "hosts": ["oot"], "description": "Ativa rolamento contínuo e dirigível, encadeado indefinidamente.", "description_en": "Enables continuous, steerable rolling, chained indefinitely."},
    {"name": "oot.player.custom_body", "status": "contract", "hosts": ["oot"], "description": "Substitui o corpo visual do jogador por qualquer esqueleto e animações nomeadas fornecidas pelo mod (Goron, Zora, Deku, lobo — o que o mod trouxer), sobrevivendo a trocas de cena automaticamente.", "description_en": "Replaces the player's visual body with any skeleton and named animations supplied by the mod (Goron, Zora, Deku, wolf: whatever the mod brings), surviving scene changes automatically."},
    {"name": "oot.player.held_item_model", "status": "contract", "hosts": ["oot"], "description": "Desenha um DL arbitrário ancorado no osso da mão do jogador, atualizado todo frame — o mecanismo que a maioria dos itens customizados com modelo na mão precisa.", "description_en": "Draws an arbitrary DL anchored to the player's hand bone, updated every frame: the mechanism most custom items with a model in hand need."},
    {"name": "oot.ocarina", "status": "planned", "hosts": ["oot"], "description": "Eventos e estado de ocarina de OoT.", "description_en": "OoT ocarina events and state."},
    {"name": "oot.dungeon_keys", "status": "planned", "hosts": ["oot"], "description": "Estado de chaves de dungeon de OoT.", "description_en": "OoT dungeon key state."},
    {"name": "oot.equipment", "status": "planned", "hosts": ["oot"], "description": "Equipamento específico de OoT.", "description_en": "OoT-specific equipment."}
