{
  "schema_version": 1,
  "api_version": "0.5.0",
  "types": [
    {"name": "game_id", "kind": "enum", "values": ["oot", "mm"], "description": "Identificador público do jogo host.", "description_en": "Public identifier of the host game."},
    {"name": "subscription", "kind": "opaque", "lua_type": "integer", "description": "Identificador opaco de inscrição em evento.", "description_en": "Opaque identifier of an event subscription."},
    {"name": "timer_handle", "kind": "opaque", "lua_type": "integer", "description": "Identificador opaco de timer em frames.", "description_en": "Opaque identifier of a frame timer."},
    {"name": "event_options", "kind": "object", "fields": [
      {"name": "priority", "type": "integer", "required": false}
    ], "description": "Opções determinísticas de inscrição.", "description_en": "Deterministic subscription options."},
    {"name": "actor_handle", "kind": "object", "fields": [
      {"name": "kind", "type": "string", "required": true},
      {"name": "slot", "type": "integer", "required": true},
      {"name": "generation", "type": "integer", "required": true},
      {"name": "scene_generation", "type": "integer", "required": true}
    ], "description": "Handle opaco validado por kind, slot, geração e cena.", "description_en": "Opaque handle validated by kind, slot, generation and scene."},
    {"name": "actor_position", "kind": "object", "fields": [
      {"name": "x", "type": "number", "required": true},
      {"name": "y", "type": "number", "required": true},
      {"name": "z", "type": "number", "required": true}
    ], "description": "Posição absoluta finita em coordenadas do mundo.", "description_en": "Finite absolute position in world coordinates."},
    {"name": "actor_rotation", "kind": "object", "fields": [
      {"name": "x", "type": "number", "required": true},
      {"name": "y", "type": "number", "required": true},
      {"name": "z", "type": "number", "required": true}
    ], "description": "Rotação XYZ em graus.", "description_en": "XYZ rotation in degrees."},
    {"name": "actor_spawn_options", "kind": "object", "fields": [
      {"name": "position", "type": "actor_position", "required": true},
      {"name": "rotation", "type": "actor_rotation", "required": false}
    ], "description": "Transform seguro para criação de ator.", "description_en": "Safe transform for spawning an actor."},
    {"name": "operation_error", "kind": "object", "fields": [
      {"name": "code", "type": "string", "required": true},
      {"name": "message", "type": "string", "required": true}
    ], "description": "Erro estruturado retornado sem lançar lua_error.", "description_en": "Structured error returned without raising lua_error."},
    {"name": "actor_snapshot", "kind": "object", "fields": [
      {"name": "handle", "type": "actor_handle", "required": true},
      {"name": "actor_id", "type": "integer", "required": true},
      {"name": "category", "type": "integer", "required": true}
    ], "description": "Snapshot mínimo e estável de ator.", "description_en": "Minimal, stable snapshot of an actor."},
    {"name": "hotkey_options", "kind": "object", "fields": [
      {"name": "default", "type": "string", "required": false},
      {"name": "label", "type": "string", "required": false}
    ], "description": "Opções de registro de hotkey (tecla default e rótulo).", "description_en": "Hotkey registration options (default key and label)."},
    {"name": "game_state", "kind": "object", "fields": [
      {"name": "mode", "type": "string", "required": true},
      {"name": "save_slot", "type": "integer", "required": false}
    ], "description": "Estado estável do gameplay sem expor structs nativas.", "description_en": "Stable gameplay state without exposing native structs."},
    {"name": "hud_icon_options", "kind": "object", "fields": [
      {"name": "alpha", "type": "integer", "required": false}
    ], "description": "Opções limitadas de apresentação de ícone no HUD.", "description_en": "Bounded presentation options for a HUD icon."},
    {"name": "attribute_breakdown_entry", "kind": "object", "fields": [
      {"name": "modifier", "type": "string", "required": true},
      {"name": "item", "type": "string", "required": false},
      {"name": "op", "type": "string", "required": true},
      {"name": "value", "type": "number", "required": true}
    ], "description": "Modificador ativo na conta de um atributo; item ausente quando o modificador não tem alvo.", "description_en": "Active modifier in an attribute's total; item is absent when the modifier has no target."},
    {"name": "attribute_modifier_view", "kind": "object", "fields": [
      {"name": "id", "type": "string", "required": true},
      {"name": "attribute", "type": "string", "required": true},
      {"name": "op", "type": "string", "required": true},
      {"name": "value", "type": "number", "required": true},
      {"name": "when", "type": "string", "required": true},
      {"name": "via", "type": "string", "required": false}
    ], "description": "Modificador que um item dá; via é a tag pela qual o item casou.", "description_en": "Modifier an item provides; via is the tag through which the item matched."},
    {"name": "attribute_modifier", "kind": "object", "fields": [
      {"name": "id", "type": "string", "required": true},
      {"name": "attribute", "type": "string", "required": true},
      {"name": "op", "type": "string", "required": true},
      {"name": "value", "type": "number", "required": true},
      {"name": "target", "type": "string", "required": false},
      {"name": "when", "type": "string", "required": false}
    ], "description": "Modificador de runtime: id com o prefixo do mod, op add, multiply_base ou multiply_total, alvo de item ou #tag e when equipped ou owned.", "description_en": "Runtime modifier: id with the mod prefix, op add, multiply_base or multiply_total, an item or #tag target and when equipped or owned."}
  ],
  "functions": [
    {"name": "ship.game.id", "description": "Devolve o identificador do jogo host atual, para selecionar comportamentos específicos de OoT ou MM.", "description_en": "Returns the current host game identifier, allowing mods to select OoT- or MM-specific behavior.", "version": "0.1.0", "stability": "stable", "arguments": [], "returns": "game_id", "availability": "common", "capability": null, "errors": []},
    {"name": "ship.game.host_version", "description": "Devolve a versão do aplicativo host configurada pelo adaptador do jogo.", "description_en": "Returns the host application version configured by the game adapter.", "version": "0.1.0", "stability": "stable", "arguments": [], "returns": "string", "availability": "common", "capability": null, "errors": []},
    {"name": "ship.game.state", "description": "Devolve um snapshot do modo atual, como gameplay, pausa, diálogo ou transição, e o slot de save quando válido. Sem jogador disponível, o modo é unavailable.", "description_en": "Returns a snapshot of the current mode, such as gameplay, pause, dialog or transition, and the save slot when valid. Without an available player, the mode is unavailable.", "version": "0.4.0", "stability": "experimental", "arguments": [], "returns": "game_state", "availability": "oot", "capability": "game.state", "errors": ["unsupported"]},
    {"name": "ship.runtime.version", "description": "Devolve a versão do runtime Link-Span informada pelo host.", "description_en": "Returns the Link-Span runtime version reported by the host.", "version": "0.1.0", "stability": "stable", "arguments": [], "returns": "string", "availability": "common", "capability": null, "errors": []},
    {"name": "ship.api.version", "description": "Devolve a versão do contrato da API Lua gerada a partir do schema.", "description_en": "Returns the Lua API contract version generated from the schema.", "version": "0.1.0", "stability": "stable", "arguments": [], "returns": "string", "availability": "common", "capability": null, "errors": []},
    {"name": "ship.capabilities.has", "description": "Devolve se a capability solicitada está disponível para o jogo atual. Use antes de depender de um serviço opcional do host.", "description_en": "Returns whether the requested capability is available for the current game. Check it before relying on an optional host service.", "version": "0.1.0", "stability": "stable", "arguments": [{"name": "name", "type": "string"}], "returns": "boolean", "availability": "common", "capability": null, "errors": ["invalid_argument"]},
    {"name": "ship.capabilities.list", "description": "Devolve os identificadores das capabilities disponíveis para o jogo atual.", "description_en": "Returns the identifiers of capabilities available for the current game.", "version": "0.1.0", "stability": "stable", "arguments": [], "returns": "array<string>", "availability": "common", "capability": null, "errors": []},
    {"name": "ship.events.on", "description": "Inscreve um callback no evento, com prioridade opcional, e devolve a inscrição para remoção posterior. Evento desconhecido causa erro Lua; o retorno do callback não controla o host.", "description_en": "Subscribes a callback to an event, with optional priority, and returns the subscription for later removal. Unknown events raise a Lua error; the callback return value does not control the host.", "version": "0.1.0", "stability": "stable", "arguments": [{"name": "event", "type": "string"}, {"name": "options_or_callback", "type": "any"}, {"name": "callback", "type": "callback", "required": false}], "returns": "subscription", "availability": "common", "capability": null, "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.events.off", "description": "Remove uma inscrição pertencente ao mod e devolve true. Inscrição inválida, já removida ou de outro mod causa erro Lua.", "description_en": "Removes a subscription owned by the mod and returns true. Invalid, already removed or foreign subscriptions raise a Lua error.", "version": "0.1.0", "stability": "stable", "arguments": [{"name": "subscription", "type": "subscription"}], "returns": "boolean", "availability": "common", "capability": null, "errors": ["invalid_handle"]},
    {"name": "ship.hooks.result", "description": "Registra a resposta ao hook transform durante seu callback e devolve true. O host define o efeito do valor; no OoT, aceita booleano, número finito ou texto e causa erro Lua fora desse contexto.", "description_en": "Records a response to a transform hook during its callback and returns true. The host defines the value's effect; OoT accepts a boolean, finite number or string and raises a Lua error outside this context.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "value", "type": "any"}], "returns": "boolean", "availability": "common", "capability": null, "errors": ["invalid_argument"]},
    {"name": "ship.hotkeys.register", "description": "Registra uma ação de teclado do mod e seu callback, com tecla padrão e rótulo opcionais. Devolve se o registro foi aceito; registrar novamente o mesmo id substitui o callback.", "description_en": "Registers a mod keyboard action and its callback, with an optional default key and label. Returns whether registration was accepted; registering the same id again replaces the callback.", "version": "0.2.0", "stability": "preview", "arguments": [{"name": "id", "type": "string"}, {"name": "options", "type": "hotkey_options", "required": false}, {"name": "callback", "type": "callback"}], "returns": "boolean", "availability": "common", "capability": null, "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.actor.spawn", "description": "Cria um ator pelo nome lógico do host e devolve seu handle. Exige permissão e respeita o limite de atores do mod; devolve nil e um operation_error quando a criação não é possível.", "description_en": "Spawns an actor by its host-defined logical name and returns its handle. Requires permission and respects the mod's actor limit; returns nil and an operation_error when spawning is not possible.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "actor_type", "type": "string"}, {"name": "options", "type": "actor_spawn_options"}], "returns": "actor_handle", "error_mode": "return", "error_type": "operation_error", "availability": "common", "capability": "actor.spawn", "errors": ["invalid_argument", "unsupported", "permission_denied", "invalid_state", "resource_limit", "host_failure"]},
    {"name": "ship.actor.destroy", "description": "Destrói um ator pertencente ao mod e devolve true. Exige permissão; devolve nil e um operation_error quando o handle ou a operação é recusado.", "description_en": "Destroys an actor owned by the mod and returns true. Requires permission; returns nil and an operation_error when the handle or operation is rejected.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "handle", "type": "actor_handle"}], "returns": "boolean", "error_mode": "return", "error_type": "operation_error", "availability": "common", "capability": "actor.destroy", "errors": ["invalid_argument", "unsupported", "permission_denied", "invalid_handle", "host_failure"]},
    {"name": "ship.actor.exists", "description": "Consulta se o ator do mod ainda existe; handle expirado devolve false. Exige permissão e devolve nil e um operation_error para outras falhas.", "description_en": "Checks whether the mod's actor still exists; an expired handle returns false. Requires permission and returns nil and an operation_error for other failures.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "handle", "type": "actor_handle"}], "returns": "boolean", "error_mode": "return", "error_type": "operation_error", "availability": "common", "capability": "actor.exists", "errors": ["invalid_argument", "unsupported", "permission_denied", "host_failure"]},
    {"name": "ship.world.travel", "description": "Solicita ao host uma viagem ao destino lógico do mundo escolhido e devolve true se a solicitação for aceita. Falta de suporte, destino inválido ou recusa do host causa erro Lua.", "description_en": "Requests travel to a logical destination in the selected world and returns true if the request is accepted. Missing support, an invalid destination or host rejection raises a Lua error.", "version": "0.3.0", "stability": "experimental", "arguments": [{"name": "world", "type": "game_id"}, {"name": "destination", "type": "string"}], "returns": "boolean", "availability": "common", "capability": "world.travel", "errors": ["invalid_argument", "unsupported", "invalid_state", "host_failure"]},
    {"name": "ship.mm.player.jump", "description": "Solicita um salto do jogador no host MM e devolve se a solicitação foi aceita.", "description_en": "Requests a player jump in the MM host and returns whether the request was accepted.", "version": "0.2.0", "stability": "experimental", "arguments": [], "returns": "boolean", "availability": "mm", "capability": "mm.player.jump", "errors": []},
    {"name": "ship.mm.spawn_dog", "description": "Solicita a criação de um cachorro no host MM e devolve se a criação foi aceita.", "description_en": "Requests spawning a dog in the MM host and returns whether spawning was accepted.", "version": "0.3.0", "stability": "experimental", "arguments": [], "returns": "boolean", "availability": "mm", "capability": "mm.spawn_dog", "errors": []},
    {"name": "ship.mm.player.set_sword_skin", "description": "Seleciona o visual da espada no MM e devolve se a troca foi aceita. O exemplo alterna entre mm e oot e depende dos assets correspondentes.", "description_en": "Selects the sword appearance in MM and returns whether the change was accepted. The example switches between mm and oot and depends on the corresponding assets.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "skin", "type": "string"}], "returns": "boolean", "availability": "mm", "capability": "mm.player.sword_skin", "errors": []},
    {"name": "ship.oot.player.jump", "description": "Aplica um impulso vertical ao jogador e devolve true. Devolve false se não houver jogador, se estiver morto ou fora do chão.", "description_en": "Applies an upward impulse to the player and returns true. Returns false if no player is available, the player is dead or is off the ground.", "version": "0.3.0", "stability": "experimental", "arguments": [], "returns": "boolean", "availability": "oot", "capability": "oot.player.jump", "errors": []},
    {"name": "ship.oot.player.set_mask", "description": "Equipa uma máscara pelo nome sem ocupar botão C e devolve true; none remove e restaura a persistência anterior. Devolve false sem jogador vivo ou para nome desconhecido.", "description_en": "Equips a mask by name without occupying a C button and returns true; none removes it and restores previous persistence. Returns false without a living player or for an unknown name.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "mask", "type": "string"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.mask", "errors": []},
    {"name": "ship.player.set_speed_multiplier", "description": "Aplica um multiplicador de movimento pelo host e devolve se foi aceito. No OoT, aceita fatores de 0.1 a 5.0; 1.0 restaura a configuração anterior. Sem serviço do host, causa erro Lua.", "description_en": "Applies a movement multiplier through the host and returns whether it was accepted. OoT accepts factors from 0.1 to 5.0; 1.0 restores the previous setting. Without a host service, it raises a Lua error.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "factor", "type": "number"}], "returns": "boolean", "availability": "common", "capability": "player.speed", "errors": []},
    {"name": "ship.player.get", "description": "Lê um campo conhecido do jogador ou um valor numérico auxiliar armazenado pelo nome. Devolve nil para campo nativo sem jogador ou nome auxiliar ainda não definido.", "description_en": "Reads a known player field or a scratch numeric value stored by name. Returns nil for a native field without a player or an unset scratch name.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "field", "type": "string"}], "returns": "any", "availability": "oot", "capability": "player.fields", "errors": []},
    {"name": "ship.player.set", "description": "Altera um campo gravável dentro da faixa permitida e devolve true; nomes desconhecidos guardam valores auxiliares. Devolve false para valor não finito, campo somente leitura ou campo nativo sem jogador.", "description_en": "Updates a writable field within its allowed range and returns true; unknown names store scratch values. Returns false for a non-finite value, a read-only field or a native field without a player.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "field", "type": "string"}, {"name": "value", "type": "number"}], "returns": "boolean", "availability": "oot", "capability": "player.fields", "errors": []},
    {"name": "ship.oot.player.attach_model", "description": "Anexa uma display list ao slot head do jogador; caminho vazio ou nil remove. Devolve false sem jogador, para slot não suportado ou asset ausente, e true ao aplicar.", "description_en": "Attaches a display list to the player's head slot; an empty or nil path removes it. Returns false without a player, for an unsupported slot or a missing asset, and true when applied.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "slot", "type": "string"}, {"name": "path", "type": "string"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.attach_model", "errors": []},
    {"name": "ship.oot.player.set_damage_immunity", "description": "Liga ou desliga a remoção das chamas do corpo a cada atualização do jogador, evitando a queimadura contínua. Devolve true para fire e false para outro tipo.", "description_en": "Enables or disables clearing body flames on each player update, preventing ongoing burning damage. Returns true for fire and false for any other kind.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "kind", "type": "string"}, {"name": "enabled", "type": "boolean"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.immunity", "errors": []},
    {"name": "ship.oot.player.set_weight", "description": "Aplica peso heavy pela mecânica das botas de ferro; normal restaura as botas anteriores. Devolve true ao aplicar e false sem jogador ou para peso desconhecido.", "description_en": "Applies heavy weight through iron boots mechanics; normal restores the previous boots. Returns true when applied and false without a player or for an unknown weight.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "weight", "type": "string"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.weight", "errors": []},
    {"name": "ship.oot.player.set_roll_blocked", "description": "Liga ou desliga o bloqueio de início do rolamento do jogador e devolve true.", "description_en": "Enables or disables blocking the start of a player roll and returns true.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "blocked", "type": "boolean"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.roll", "errors": []},
    {"name": "ship.oot.player.set_body", "description": "Ativa um corpo customizado com skeleton e animações do mod e devolve true; nil restaura o corpo padrão. Devolve false sem jogador para ativar ou para configuração ou recursos inválidos.", "description_en": "Activates a custom body with a mod-provided skeleton and animations and returns true; nil restores the default body. Returns false without a player for activation or for invalid configuration or resources.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "spec", "type": "any"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.custom_body", "errors": []},
    {"name": "ship.oot.player.get_body", "description": "Devolve a configuração e o estado do corpo customizado ativo, incluindo a animação atual. Devolve nil quando nenhum corpo customizado está ativo.", "description_en": "Returns the configuration and state of the active custom body, including its current animation. Returns nil when no custom body is active.", "version": "0.4.0", "stability": "experimental", "arguments": [], "returns": "any", "availability": "oot", "capability": "oot.player.custom_body", "errors": []},
    {"name": "ship.oot.player.play_body_animation", "description": "Toca uma animação nomeada do corpo customizado em once, loop ou reverse_once e devolve true. Devolve false sem corpo ativo ou para nome, modo, velocidade ou recurso inválido.", "description_en": "Plays a named custom body animation in once, loop or reverse_once mode and returns true. Returns false without an active body or for an invalid name, mode, speed or resource.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "name", "type": "string"}, {"name": "mode", "type": "string", "required": false}, {"name": "speed", "type": "number", "required": false}], "returns": "boolean", "availability": "oot", "capability": "oot.player.custom_body", "errors": []},
    {"name": "ship.oot.player.set_body_segment", "description": "Troca o recurso associado a um segmento de desenho do corpo customizado e devolve true. Devolve false sem corpo ativo, para segmento fora de 1 a 15 ou recurso ausente.", "description_en": "Changes the resource assigned to a custom body drawing segment and returns true. Returns false without an active body, for a segment outside 1 to 15 or a missing resource.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "segment", "type": "integer"}, {"name": "path", "type": "string"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.custom_body", "errors": []},
    {"name": "ship.oot.player.set_held_item_model", "description": "Define uma display list ancorada em left_hand ou right_hand; nil ou caminho vazio remove. Devolve true ao aplicar e false para slot não suportado ou asset ausente.", "description_en": "Sets a display list anchored to left_hand or right_hand; nil or an empty path removes it. Returns true when applied and false for an unsupported slot or a missing asset.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "slot", "type": "string"}, {"name": "path", "type": "string"}], "returns": "boolean", "availability": "oot", "capability": "oot.player.held_item_model", "errors": []},
    {"name": "ship.oot.cutscene.start", "description": "Inicia uma sequência de câmera por 1 a 600 frames e devolve true, com congelamento do jogador opcional. Devolve false fora de gameplay, se já houver sequência ativa ou se não puder obter a câmera.", "description_en": "Starts a camera sequence for 1 to 600 frames and returns true, optionally freezing the player. Returns false outside gameplay, if a sequence is already active or if the camera cannot be obtained.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "frames", "type": "integer"}, {"name": "options", "type": "any", "required": false}], "returns": "boolean", "availability": "oot", "capability": "oot.cutscene", "errors": ["invalid_argument", "invalid_state"]},
    {"name": "ship.oot.cutscene.stop", "description": "Encerra a sequência de câmera criada pela API e libera os estados que ela assumiu. Devolve true mesmo se nenhuma sequência estiver ativa.", "description_en": "Stops the camera sequence created by the API and releases the states it took over. Returns true even if no sequence is active.", "version": "0.4.0", "stability": "experimental", "arguments": [], "returns": "boolean", "availability": "oot", "capability": "oot.cutscene", "errors": []},
    {"name": "ship.oot.cutscene.is_active", "description": "Devolve se uma sequência de câmera criada por esta API está ativa; não consulta todas as cutscenes nativas do jogo.", "description_en": "Returns whether a camera sequence created by this API is active; it does not query all native game cutscenes.", "version": "0.4.0", "stability": "experimental", "arguments": [], "returns": "boolean", "availability": "oot", "capability": "oot.cutscene", "errors": []},
    {"name": "ship.oot.env.get", "description": "Lê time_of_day normalizado de 0 a 1, is_night como 0 ou 1, ou scene_id. Devolve nil para campo desconhecido e -1 para scene_id sem cena disponível.", "description_en": "Reads time_of_day normalized from 0 to 1, is_night as 0 or 1, or scene_id. Returns nil for an unknown field and -1 for scene_id without an available scene.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "field", "type": "string"}], "returns": "any", "availability": "oot", "capability": "oot.env", "errors": []},
    {"name": "ship.log.debug", "description": "Registra uma mensagem de depuração identificada pelo mod. Não devolve valor; mensagem não textual causa erro Lua.", "description_en": "Logs a debug message identified by the mod. Returns no value; a non-string message raises a Lua error.", "version": "0.1.0", "stability": "stable", "arguments": [{"name": "message", "type": "string"}], "returns": "nil", "availability": "common", "capability": null, "errors": ["invalid_argument"]},
    {"name": "ship.log.info", "description": "Registra uma mensagem informativa identificada pelo mod. Não devolve valor; mensagem não textual causa erro Lua.", "description_en": "Logs an informational message identified by the mod. Returns no value; a non-string message raises a Lua error.", "version": "0.1.0", "stability": "stable", "arguments": [{"name": "message", "type": "string"}], "returns": "nil", "availability": "common", "capability": null, "errors": ["invalid_argument"]},
    {"name": "ship.log.warn", "description": "Registra um aviso identificado pelo mod. Não devolve valor; mensagem não textual causa erro Lua.", "description_en": "Logs a warning identified by the mod. Returns no value; a non-string message raises a Lua error.", "version": "0.1.0", "stability": "stable", "arguments": [{"name": "message", "type": "string"}], "returns": "nil", "availability": "common", "capability": null, "errors": ["invalid_argument"]},
    {"name": "ship.log.error", "description": "Registra uma mensagem de erro identificada pelo mod. Não devolve valor; mensagem não textual causa erro Lua.", "description_en": "Logs an error message identified by the mod. Returns no value; a non-string message raises a Lua error.", "version": "0.1.0", "stability": "stable", "arguments": [{"name": "message", "type": "string"}], "returns": "nil", "availability": "common", "capability": null, "errors": ["invalid_argument"]},
    {"name": "ship.timer.after", "description": "Agenda um callback para executar uma vez após o atraso em frames do host e devolve seu handle. O atraso deve ser de pelo menos um frame; descarregar o mod cancela o timer.", "description_en": "Schedules a callback to run once after a delay in host frames and returns its handle. The delay must be at least one frame; unloading the mod cancels the timer.", "version": "0.3.0", "stability": "experimental", "arguments": [{"name": "frames", "type": "integer"}, {"name": "callback", "type": "callback"}], "returns": "timer_handle", "availability": "common", "capability": "core.timers", "errors": ["invalid_argument", "resource_limit", "unsupported"]},
    {"name": "ship.timer.every", "description": "Agenda um callback repetido a cada intervalo em frames do host e devolve seu handle. O intervalo deve ser de pelo menos um frame; descarregar o mod cancela o timer.", "description_en": "Schedules a callback to repeat at an interval in host frames and returns its handle. The interval must be at least one frame; unloading the mod cancels the timer.", "version": "0.3.0", "stability": "experimental", "arguments": [{"name": "frames", "type": "integer"}, {"name": "callback", "type": "callback"}], "returns": "timer_handle", "availability": "common", "capability": "core.timers", "errors": ["invalid_argument", "resource_limit", "unsupported"]},
    {"name": "ship.timer.cancel", "description": "Cancela um timer registrado pelo mod e devolve true. Handle inválido ou não registrado pelo mod causa erro Lua.", "description_en": "Cancels a timer registered by the mod and returns true. An invalid handle or one not registered by the mod raises a Lua error.", "version": "0.3.0", "stability": "experimental", "arguments": [{"name": "handle", "type": "timer_handle"}], "returns": "boolean", "availability": "common", "capability": "core.timers", "errors": ["invalid_argument", "invalid_handle"]},
    {"name": "ship.storage.get", "description": "Lê uma chave no armazenamento local do mod. Devolve o valor salvo, o padrão fornecido ou nil se a chave não existir; sem backend configurado, causa erro Lua.", "description_en": "Reads a key in the mod's local storage. Returns its saved value, the supplied default or nil if absent; without a configured backend, it raises a Lua error.", "version": "0.3.0", "stability": "experimental", "arguments": [{"name": "key", "type": "string"}, {"name": "default", "type": "any", "required": false}], "returns": "any", "availability": "common", "capability": "core.storage", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.storage.set", "description": "Grava um booleano, número ou texto no armazenamento local do mod e devolve true. Valor inválido, limite excedido ou backend ausente causa erro Lua; a gravação em disco depende do host.", "description_en": "Stores a boolean, number or string in the mod's local storage and returns true. Invalid values, exceeded limits or a missing backend raise a Lua error; disk persistence depends on the host.", "version": "0.3.0", "stability": "experimental", "arguments": [{"name": "key", "type": "string"}, {"name": "value", "type": "any"}], "returns": "boolean", "availability": "common", "capability": "core.storage", "errors": ["invalid_argument", "resource_limit", "unsupported"]},
    {"name": "ship.storage.delete", "description": "Remove uma chave do armazenamento local do mod e devolve se ela existia e foi removida. Sem backend configurado, causa erro Lua.", "description_en": "Removes a key from the mod's local storage and returns whether it existed and was removed. Without a configured backend, it raises a Lua error.", "version": "0.3.0", "stability": "experimental", "arguments": [{"name": "key", "type": "string"}], "returns": "boolean", "availability": "common", "capability": "core.storage", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.storage.clear", "description": "Remove todas as chaves do armazenamento local deste mod e devolve a quantidade removida. Não limpa outros mods; sem backend configurado, causa erro Lua.", "description_en": "Removes all keys from this mod's local storage and returns the number removed. Other mods are unaffected; without a configured backend, it raises a Lua error.", "version": "0.3.0", "stability": "experimental", "arguments": [], "returns": "integer", "availability": "common", "capability": "core.storage", "errors": ["unsupported"]},
    {"name": "ship.storage.shared.get", "description": "Lê uma chave do mesmo mod no backend compartilhado entre jogos. Devolve o valor, o padrão fornecido ou nil se ausente; sem backend compartilhado configurado, causa erro Lua.", "description_en": "Reads a key for the same mod in the cross-game shared backend. Returns the value, the supplied default or nil if absent; without a configured shared backend, it raises a Lua error.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "key", "type": "string"}, {"name": "default", "type": "any", "required": false}], "returns": "any", "availability": "common", "capability": "core.storage.shared", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.storage.shared.set", "description": "Grava um booleano, número ou texto no backend compartilhado entre jogos, isolado pelo id do mod, e devolve true. Valor inválido, limite excedido ou backend ausente causa erro Lua.", "description_en": "Stores a boolean, number or string in the cross-game shared backend, isolated by mod id, and returns true. Invalid values, exceeded limits or a missing backend raise a Lua error.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "key", "type": "string"}, {"name": "value", "type": "any"}], "returns": "boolean", "availability": "common", "capability": "core.storage.shared", "errors": ["invalid_argument", "resource_limit", "unsupported"]},
    {"name": "ship.storage.shared.delete", "description": "Remove uma chave do mod no backend compartilhado entre jogos e devolve se ela foi removida. Sem backend compartilhado configurado, causa erro Lua.", "description_en": "Removes a mod key from the cross-game shared backend and returns whether it was removed. Without a configured shared backend, it raises a Lua error.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "key", "type": "string"}], "returns": "boolean", "availability": "common", "capability": "core.storage.shared", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.storage.shared.clear", "description": "Remove todas as chaves deste mod no backend compartilhado e devolve a quantidade removida. Preserva o armazenamento local e outros mods; sem backend compartilhado, causa erro Lua.", "description_en": "Removes all keys for this mod in the shared backend and returns the number removed. Local storage and other mods are preserved; without a shared backend, it raises a Lua error.", "version": "0.4.0", "stability": "experimental", "arguments": [], "returns": "integer", "availability": "common", "capability": "core.storage.shared", "errors": ["unsupported"]},
    {"name": "ship.hud.draw_rect", "description": "Desenha um retângulo colorido no overlay e devolve true. Só funciona durante hook.oot.hud.draw; devolve false fora do callback, para tamanho inválido ou ao exceder o orçamento de desenho.", "description_en": "Draws a colored rectangle in the overlay and returns true. Only works during hook.oot.hud.draw; returns false outside the callback, for invalid dimensions or when the drawing budget is exceeded.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "x", "type": "integer"}, {"name": "y", "type": "integer"}, {"name": "w", "type": "integer"}, {"name": "h", "type": "integer"}, {"name": "r", "type": "integer", "required": false}, {"name": "g", "type": "integer", "required": false}, {"name": "b", "type": "integer", "required": false}, {"name": "a", "type": "integer", "required": false}], "returns": "boolean", "availability": "oot", "capability": "hud.draw", "errors": ["invalid_argument", "invalid_state"]},
    {"name": "ship.hud.draw_text", "description": "Desenha texto colorido e escalado no overlay, limitado a 128 bytes. Devolve true ao desenhar e false fora de hook.oot.hud.draw ou ao exceder o orçamento de desenho.", "description_en": "Draws colored, scaled text in the overlay, limited to 128 bytes. Returns true when drawn and false outside hook.oot.hud.draw or when the drawing budget is exceeded.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "text", "type": "string"}, {"name": "x", "type": "integer"}, {"name": "y", "type": "integer"}, {"name": "r", "type": "integer", "required": false}, {"name": "g", "type": "integer", "required": false}, {"name": "b", "type": "integer", "required": false}, {"name": "a", "type": "integer", "required": false}, {"name": "scale", "type": "number", "required": false}], "returns": "boolean", "availability": "oot", "capability": "hud.draw", "errors": ["invalid_argument", "invalid_state"]},
    {"name": "ship.hud.draw_ring", "description": "Desenha um arco aproximado do topo no sentido horário, com fração limitada a 0 a 1. Só funciona em hook.oot.hud.draw; devolve false fora dele ou sem orçamento, e true também quando não há arco a desenhar.", "description_en": "Draws an approximate arc clockwise from the top, with its fraction clamped to 0 to 1. Only works in hook.oot.hud.draw; returns false outside it or without budget, and true also when there is no arc to draw.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "cx", "type": "number"}, {"name": "cy", "type": "number"}, {"name": "radius", "type": "number"}, {"name": "thickness", "type": "number", "required": false}, {"name": "fraction", "type": "number", "required": false}, {"name": "r", "type": "integer", "required": false}, {"name": "g", "type": "integer", "required": false}, {"name": "b", "type": "integer", "required": false}, {"name": "a", "type": "integer", "required": false}], "returns": "boolean", "availability": "oot", "capability": "hud.draw", "errors": ["invalid_argument", "invalid_state"]}
    ,{"name": "ship.hud.draw_icon", "description": "Desenha uma textura RGBA32 de 32x32 no HUD e devolve true, escalada para 1 a 64 pixels por dimensão. Devolve false fora de hook.oot.hud.draw, para recurso ou tamanho inválido ou sem orçamento.", "description_en": "Draws a 32x32 RGBA32 texture on the HUD and returns true, scaled to 1 to 64 pixels per dimension. Returns false outside hook.oot.hud.draw, for an invalid resource or size, or without drawing budget.", "version": "0.4.0", "stability": "experimental", "arguments": [{"name": "path", "type": "string"}, {"name": "x", "type": "integer"}, {"name": "y", "type": "integer"}, {"name": "w", "type": "integer"}, {"name": "h", "type": "integer"}, {"name": "options", "type": "hud_icon_options", "required": false}], "returns": "boolean", "availability": "oot", "capability": "hud.icons", "errors": ["invalid_argument", "invalid_state", "unsupported"]},
    {"name": "ship.menu.register", "description": "Registra uma página declarativa de menu do mod (checkbox, sliders, escolha, ação, texto e separador) e devolve true. Os valores persistem só em ship.storage e o input chega fora do draw pass; exige core.menu.", "description_en": "Registers a declarative menu page for the mod (checkbox, sliders, choice, action, text and separator widgets) and returns true. Values persist only in ship.storage and input arrives outside the draw pass; requires core.menu.", "version": "0.5.0", "stability": "preview", "arguments": [{"name": "page", "type": "any"}], "returns": "boolean", "availability": "common", "capability": "core.menu", "errors": ["unsupported", "invalid_argument", "resource_limit", "host_failure"]},
    {"name": "ship.attributes.value", "description": "Devolve o valor final do atributo para o jogador agora. Atributo não declarado devolve nil e \"unknown attribute\"; exige core.attributes.", "description_en": "Returns the player's final value for the attribute now. An undeclared attribute returns nil and \"unknown attribute\"; requires core.attributes.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "attribute", "type": "string"}], "returns": "number", "availability": "common", "capability": "core.attributes", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.attributes.breakdown", "description": "Lista os modificadores ativos do atributo e o item de cada um, na ordem de carga dos mods e depois por id. Atributo não declarado devolve nil e \"unknown attribute\".", "description_en": "Lists the attribute's active modifiers and the item for each, in mod load order and then by id. An undeclared attribute returns nil and \"unknown attribute\".", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "attribute", "type": "string"}], "returns": "array<attribute_breakdown_entry>", "availability": "common", "capability": "core.attributes", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.attributes.modifiers_of", "description": "Lista o que o item dá, ativo ou não, com a tag pela qual casou em via.", "description_en": "Lists what the item provides, active or not, with the tag it matched through in via.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "item", "type": "string"}], "returns": "array<attribute_modifier_view>", "availability": "common", "capability": "core.attributes", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.attributes.has_tag", "description": "Devolve se o item pertence à tag (sem #), já resolvendo tags aninhadas.", "description_en": "Returns whether the item belongs to the tag (without #), with nested tags already resolved.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "item", "type": "string"}, {"name": "tag", "type": "string"}], "returns": "boolean", "availability": "common", "capability": "core.attributes", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.attributes.tag_members", "description": "Devolve os membros resolvidos da tag (sem #), em ordem; tag desconhecida devolve lista vazia.", "description_en": "Returns the resolved members of the tag (without #), in order; an unknown tag returns an empty list.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "tag", "type": "string"}], "returns": "array<string>", "availability": "common", "capability": "core.attributes", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.attributes.add_modifier", "description": "Acrescenta um modificador de runtime do mod e devolve true, ou nil e o erro. O id precisa do prefixo do mod e não pode repetir; sem target, vale direto no jogador. Não vai para o save.", "description_en": "Adds a runtime modifier for the mod and returns true, or nil and the error. The id needs the mod prefix and must not repeat; without target it applies directly to the player. It is not saved.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "modifier", "type": "attribute_modifier"}], "returns": "boolean", "availability": "common", "capability": "core.attributes", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.attributes.remove_modifier", "description": "Remove um modificador de runtime do próprio mod e devolve se removeu; id de outro mod devolve false.", "description_en": "Removes one of the mod's runtime modifiers and returns whether it was removed; another mod's id returns false.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "id", "type": "string"}], "returns": "boolean", "availability": "common", "capability": "core.attributes", "errors": ["invalid_argument", "unsupported"]},
    {"name": "ship.native.has", "description": "Devolve se o provider nativo do mod disponibiliza a função pelo nome. Sem provider, devolve false; nome vazio ou maior que 128 bytes causa erro Lua.", "description_en": "Returns whether the mod's native provider exposes the named function. Without a provider, returns false; an empty name or one longer than 128 bytes raises a Lua error.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "name", "type": "string"}], "returns": "boolean", "availability": "common", "capability": null, "errors": ["invalid_argument"]},
    {"name": "ship.native.call", "description": "Envia uma string de bytes à função nativa do mod e devolve a resposta. Devolve nil e um operation_error se a função não estiver disponível, o estado for inválido ou a requisição ou resposta exceder 65536 bytes.", "description_en": "Sends a byte string to the mod's native function and returns its response. Returns nil and an operation_error if the function is unavailable, the state is invalid or the request or response exceeds 65536 bytes.", "version": "0.5.0", "stability": "experimental", "arguments": [{"name": "name", "type": "string"}, {"name": "request", "type": "string"}], "returns": "string", "error_mode": "return", "error_type": "operation_error", "availability": "common", "capability": null, "errors": ["unsupported", "invalid_argument", "invalid_handle", "invalid_state", "resource_limit", "host_failure"]}
  ],
  "error_codes": ["unsupported", "invalid_argument", "invalid_handle", "invalid_state", "permission_denied", "resource_limit", "host_failure", "script_failure"]
